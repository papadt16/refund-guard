<div class="top"><div class="logo" id="lg">Demo Bank</div><span id="who" class="hint"></span></div><div class="wrap" id="app">Loading…</div><div id="mod"></div>

<script id="dt-engine">
/* ===== DT ENGINE v1 — dependency-free refund-resolution engine =====
   Flow: detect (failed + debited) -> run checks via ADAPTERS -> feature vector -> logistic confidence score -> verdict.
   p = probability a refund is DUE. verdict: p>=hi 'refund' | p<=lo 'auto_success' | else 'review'. Humans always decide refunds.
   Train: DTEngine.train(examples,cfg) where examples=[{f:{tsq,ben,rev,dup},y:0|1}]. */
const DTEngine=(()=>{
const FEATS=['tsq','ben','rev','dup'],sig=x=>1/(1+Math.exp(-x)),fmt=v=>v===1?'CONFIRMED':v===.5?'PENDING/NO RESPONSE':'NONE';
const defaults=()=>({version:1,bias:2.5,w:{tsq:-3,ben:-3.5,rev:-2,dup:.5},hi:.8,lo:.1,slaMin:30,trainedOn:0});
/* ADAPTERS = the ONLY place the engine touches the outside world. Each may be sync or async (return a value or a Promise).
   Real integration map (shape returned -> what to call):
   ledger(tx)      -> {debited:boolean}               core-banking ledger lookup by tx.ref
   core(tx)        -> {status:'SUCCESS'|'FAILED'}     core switch / transaction-service status
   nip(tx)         -> {v:1|.5|0}  1 approved, .5 pending or no response, 0 not found   e.g. NIBSS NIP transaction status query by session id tx.sess
   beneficiary(tx) -> {v:1|.5|0}  1 credit confirmed, .5 unknown, 0 not credited       beneficiary bank confirmation
   reversal(tx)    -> {v:1|0}     1 a reversal entry already exists                    ledger / GL reversal sweep
   dup(tx,all)     -> {v:1|0}     1 similar transfer recently                          duplicate / fraud screen
   The simulated adapters below read tx.sim, which only exists in this demo. Pass your own set as the 6th argument of investigate(). */
const adapters={
 ledger:tx=>({debited:tx.debited}),
 core:tx=>({status:tx.sim==='ok'?'SUCCESS':'FAILED'}),
 nip:tx=>({v:{ok:1,mismatch:1,ghost:0,clean:0,unclear:.5}[tx.sim]??0}),
 beneficiary:tx=>({v:{ok:1,mismatch:1,ghost:0,clean:0,unclear:.5}[tx.sim]??0}),
 reversal:tx=>({v:0}),
 dup:(tx,all)=>({v:all.filter(x=>x.id!==tx.id&&x.uid===tx.uid&&x.ra===tx.ra&&x.amt===tx.amt&&Math.abs(x.ts-tx.ts)<36e5).length?1:0})};
const score=(f,c)=>sig(c.bias+FEATS.reduce((s,k)=>s+c.w[k]*(f[k]||0),0));
const explain=(f,c)=>[...FEATS.map(k=>({k,v:(f||{})[k]||0,w:c.w[k],c:c.w[k]*((f||{})[k]||0)})),{k:'bias',v:1,w:c.bias,c:c.bias}];
const conf=p=>Math.max(p,1-p);
const sla=(cs,now=Date.now())=>cs.status!=='awaiting'||!cs.slaDue?{state:'none'}:now>cs.slaDue?{state:'overdue',mins:Math.ceil((now-cs.slaDue)/6e4)}:{state:'ok',mins:Math.ceil((cs.slaDue-now)/6e4)};
const evaluate=(ex,c)=>{if(!ex.length)return null;let ok=0,L=0;for(const x of ex){const p=Math.min(1-1e-6,Math.max(1e-6,score(x.f||{},c)));if((p>=.5)===(x.y===1))ok++;L-=x.y===1?Math.log(p):Math.log(1-p)}return{n:ex.length,acc:ok/ex.length,loss:L/ex.length}};
/* PATTERNS(txs,cases,opts?) -> {banks:[{bank,total,failed,rate,flagged}], customers:[{uid,name,disputes,falseClaims,falseRate,refunds,flagged,reason}]}
   txs=[{id,uid,rb,status,caseId}], cases=[{txid,uid,uname,type,status,verdict}]. A transfer counts as failed if it is failed/refunded now OR was auto-flagged (auto-correction later turns it Successful).
   opts defaults: minTx 3, bankRate .4 (flag a bank at 40% failures), minDisputes 3, falseRate .5 (flag a customer when half their disputes were verified delivered / not debited), minRefunds 3. */
const patterns=(txs,cases,o={})=>{const O={minTx:3,bankRate:.4,minDisputes:3,falseRate:.5,minRefunds:3,...o},cs={};cases.forEach(c=>cs[c.txid]=c);
 const failed=t=>t.status==='failed'||t.status==='refunded'||(cs[t.id]&&cs[t.id].type==='auto'),B={};
 txs.forEach(t=>{const b=B[t.rb]=B[t.rb]||{bank:t.rb,total:0,failed:0};b.total++;if(failed(t))b.failed++});
 const banks=Object.values(B).map(b=>({...b,rate:b.failed/b.total,flagged:b.total>=O.minTx&&b.failed/b.total>=O.bankRate})).sort((a,b)=>b.rate-a.rate||b.total-a.total);
 const U={};cases.forEach(c=>{const u=U[c.uid]=U[c.uid]||{uid:c.uid,name:c.uname,disputes:0,falseClaims:0,refunds:0};if(c.type==='customer'){u.disputes++;if(c.verdict==='auto_success'||c.verdict==='no_debit')u.falseClaims++}if(c.status==='refunded')u.refunds++});
 const customers=Object.values(U).map(u=>{const fr=u.disputes?u.falseClaims/u.disputes:0,r=[];if(u.disputes>=O.minDisputes&&fr>=O.falseRate)r.push(u.falseClaims+' of '+u.disputes+' disputes were verified as delivered or not debited');if(u.refunds>=O.minRefunds)r.push(u.refunds+' refunds approved');return{...u,falseRate:fr,flagged:r.length>0,reason:r.join('; ')}}).sort((a,b)=>(b.flagged-a.flagged)||b.falseClaims-a.falseClaims);
 return{banks,customers}};
/* PARSESETTLEMENT(csvText) -> [{ref,sess,amount,status}] with status normalised to SUCCESS | FAILED | REVERSED | UNKNOWN.
   Header row required. Accepted column names: ref/reference/transactionid/txid, session/sessionid, amount/amt, status/state. */
const parseSettlement=text=>{const lines=String(text).split(String.fromCharCode(10)).map(l=>l.trim()).filter(Boolean);if(lines.length<2)return[];
 const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o};
 const H=sp(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,'')),ix=(...n)=>H.findIndex(h=>n.includes(h)),ri=ix('ref','reference','transactionid','txid'),si=ix('session','sessionid'),ai=ix('amount','amt'),ti=ix('status','state');
 const norm=v=>{v=String(v||'').toUpperCase();return /SUCC|APPROV|^00$/.test(v)?'SUCCESS':/REVERS/.test(v)?'REVERSED':/FAIL|DECLIN|REJECT/.test(v)?'FAILED':'UNKNOWN'};
 return lines.slice(1).map(l=>{const c=sp(l);return{ref:ri>=0?c[ri]:'',sess:si>=0?c[si]:'',amount:ai>=0?+String(c[ai]).replace(/[^0-9.-]/g,''):NaN,status:norm(ti>=0?c[ti]:'')}})};
/* RECONCILE(rows,txs) -> {summary:{rows,matched,issues,byKind,unreported}, issues:[{kind,ref,txid,uid,amount,reported,detail,action}]}
   rows = parseSettlement() output (what the switch settled), txs = our ledger. kind: ghost_debit | reversal_not_applied | status_mismatch | amount_mismatch | refunded_but_settled | missing_in_ledger.
   reported = a case already exists for it. action: open_case | review_case | correct_to_success | investigate. Reports only; the caller decides what to apply. */
const reconcile=(rows,txs)=>{const byRef={},bySess={};txs.forEach(t=>{byRef[t.ref]=t;bySess[t.sess]=t});const seen=new Set(),I=[];let matched=0;
 const add=(kind,t,r,detail,action)=>I.push({kind,ref:(t&&t.ref)||(r&&r.ref)||'',txid:t?t.id:null,uid:t?t.uid:null,amount:t?t.amt:(r&&r.amount),reported:!!(t&&t.caseId),detail,action});
 rows.forEach(r=>{const t=byRef[r.ref]||bySess[r.sess];if(!t){if(r.status==='SUCCESS')add('missing_in_ledger',null,r,'Settled by the switch but there is no internal record','investigate');return}
  seen.add(t.id);
  if(!isNaN(r.amount)&&Math.abs(r.amount-t.amt)>.005)add('amount_mismatch',t,r,'Settlement '+r.amount+' vs ledger '+t.amt,'investigate');
  else if(r.status==='SUCCESS'&&t.status==='failed')add('status_mismatch',t,r,'Settled as SUCCESS but our status is FAILED'+(t.debited?' and the customer was debited':''),'correct_to_success');
  else if(r.status==='SUCCESS'&&t.status==='refunded')add('refunded_but_settled',t,r,'Customer was refunded but the transfer settled as SUCCESS','investigate');
  else if((r.status==='FAILED'||r.status==='REVERSED')&&t.debited&&t.status!=='refunded')add(r.status==='REVERSED'?'reversal_not_applied':'ghost_debit',t,r,'Settlement says '+r.status+' but the customer was debited and not refunded',t.caseId?'review_case':'open_case');
  else matched++});
 txs.forEach(t=>{if(seen.has(t.id))return;if(t.debited&&t.status==='failed')add('ghost_debit',t,null,'Debited and failed with no settlement entry',t.caseId?'review_case':'open_case')});
 const by={};I.forEach(i=>by[i.kind]=(by[i.kind]||0)+1);return{summary:{rows:rows.length,matched,issues:I.length,byKind:by,unreported:I.filter(i=>!i.reported&&i.uid).length},issues:I}};
/* SAMPLESETTLEMENT(txs) -> CSV text for demos: builds a fake end-of-day file from tx.sim (demo-only, a real bank supplies the real file). */
const sampleSettlement=txs=>['ref,session,amount,status',...txs.filter(t=>t.sim!=='unclear').map(t=>[t.ref,t.sess,t.amt,t.sim==='ok'||t.sim==='mismatch'?'SUCCESS':'FAILED'].join(','))].join(String.fromCharCode(10));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function investigate(tx,all,cfg,log,delay=550,ad=adapters){
 const L=async(m,k)=>{await log(m,k);await wait(delay)};
 const led=await ad.ledger(tx),core=await ad.core(tx);
 await L(led.debited?'CHECK 1 Ledger: debit of '+tx.amt+' found for ref '+tx.ref+'.':'CHECK 1 Ledger: no debit entry.',led.debited?'w':'k');
 if(!led.debited)return{f:{},p:0,verdict:'no_debit'};
 await L('CHECK 2 Core switch status: '+core.status+'.',core.status==='FAILED'?'w':'k');
 const [nip,ben,rev,dup]=await Promise.all([ad.nip(tx),ad.beneficiary(tx),ad.reversal(tx),ad.dup(tx,all)]);
 await L('CHECK 3 NIP status query, session '+tx.sess+': '+(nip.v===1?'APPROVED':nip.v===.5?'PENDING':'NOT FOUND'),nip.v===1?'k':'w');
 await L('CHECK 4 Beneficiary bank ('+tx.rb+') credit: '+fmt(ben.v),ben.v===1?'k':'w');
 await L('CHECK 5 Reversal sweep: '+(rev.v?'reversal found':'no reversal entry within SLA window'),rev.v?'k':'e');
 await L('CHECK 6 Duplicate/fraud screen: '+(dup.v?'similar transfer in last hour':'clear'),dup.v?'w':'k');
 const f={tsq:nip.v,ben:ben.v,rev:rev.v,dup:dup.v},p=score(f,cfg);
 const verdict=p>=cfg.hi?'refund':p<=cfg.lo?'auto_success':'review';
 await L('SCORE p(refund due)='+p.toFixed(3)+' (hi '+cfg.hi+', lo '+cfg.lo+') -> '+verdict.toUpperCase(),verdict==='refund'?'e':verdict==='review'?'w':'k');
 return{f,p,verdict}}
function train(ex,cfg,epochs=300,lr=.3){const c=JSON.parse(JSON.stringify(cfg));if(!ex.length)return c;
 const P=defaults(),lam=.02;/* L2 pull towards the defaults so a few decisions cannot send weights to extremes */
 for(let e=0;e<epochs;e++)for(const x of ex){const err=x.y-score(x.f,c);c.bias+=lr*(err-lam*(c.bias-P.bias));FEATS.forEach(k=>c.w[k]+=lr*(err*(x.f[k]||0)-lam*(c.w[k]-P.w[k])))}
 c.before=evaluate(ex,cfg);c.metrics=evaluate(ex,c);c.version++;c.trainedOn=ex.length;return c}
return{FEATS,defaults,adapters,score,explain,conf,sla,evaluate,patterns,parseSettlement,reconcile,sampleSettlement,investigate,train}})();
</script>

<script>
const $=s=>document.querySelector(s),N=n=>'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2}),D=t=>new Date(t).toLocaleString('en-NG',{month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}),rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const BANK='Demo Bank'; /* <- change the bank's name here */
const clean=v=>String(v||'').replace(/[<>&`\\]/g,'').replace(/'/g,'’').replace(/"/g,'”').trim().slice(0,60);
const STAFF=location.hash==='#accountant';let db,user,uid,S={users:[],txs:[],cases:[],examples:[],audit:[]},CFG=DTEngine.defaults(),tab='dash',cur=null,tx=null,busy=false,canW=null,LD={},ib=null,seenN=null;
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)};
const st=s=>`<span class="tag s-${s}">${({success:'Successful',failed:'Failed',refunded:'Refunded',awaiting:'Awaiting accountant',investigating:'DT Engine checking…',auto:'Auto-resolved',rejected:'Rejected'})[s]||s}</span>`;
const put=(c,id,d)=>db.collection(c).doc(id).set(d),upd=(c,id,d)=>db.collection(c).doc(id).update(d);
const aud=m=>put('audit',rid(),{t:Date.now(),m}).catch(()=>{});
const sc=t=>{const c=S.cases.find(x=>x.id===t.caseId);return t.status==='failed'&&t.debited&&c&&(c.status==='awaiting'||c.status==='investigating')?'<span class="tag s-awaiting">Failed · under review</span>':st(t.status)};
const hold=e=>{if(e&&e.code==='revoked')toast('Access to the shared data was withdrawn.')};
const watch=(n,q)=>(q||db.collection(n)).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)LD[n]=1;R()},hold);
const watchMe=()=>db.doc('users/'+uid).onSnapshot(s=>{S.users=s.exists?[{id:uid,...s.data()}]:[];if(!s.metadata.fromCache)LD.users=1;R()},hold);
async function boot(){
 $('#lg').textContent=STAFF?BANK+' · Staff portal':BANK;
 const cl=window.claude&&await claude.use('db');user=window.claude&&await claude.use('user');
 if(!cl||!user){$('#app').innerHTML='<div class="card">Please open this page signed in to claude.ai (as a Contributor on the artifact) so shared data can load.</div>';return}
 db=cl;uid=await user.id();
 if(!uid){$('#app').innerHTML='<div class="card">Could not identify your account. Open this page signed in to claude.ai.</div>';return}
 if(STAFF&&!(await user.canEdit())){$('#app').innerHTML='<div class="card">The staff portal is only available to people with edit access to this artifact. Ask the owner to give you the Editor role.</div>';return}
 if(STAFF)['users','txs','cases','examples','audit'].forEach(n=>watch(n));
 else{canW=await user.can('data.write');watchMe();watch('txs',db.collection('txs').where('uid','==',uid));watch('cases',db.collection('cases').where('uid','==',uid));watchN()}
 db.collection('engine').doc('config').onSnapshot(s=>{if(s.exists)CFG={...DTEngine.defaults(),...s.data()};R()});
 addEventListener('hashchange',()=>location.reload())}
const FQ='#app input,#app select,#mod input,#mod select';
const snapF=()=>{const o={},a=document.activeElement;document.querySelectorAll(FQ).forEach(e=>{const k=e.name||e.id;if(k)o[k]=e.value});return{o,k:a&&(a.name||a.id),p:a&&a.selectionStart}};
const putF=z=>{document.querySelectorAll(FQ).forEach(e=>{const k=e.name||e.id;if(k&&k in z.o)e.value=z.o[k]});if(z.k){const e=document.querySelector('[name="'+z.k+'"],#'+z.k);if(e){e.focus();try{if(z.p!=null)e.setSelectionRange(z.p,z.p)}catch(x){}}}};
function R(){if(!db)return;const z=snapF();$('#app').innerHTML=STAFF?staff():(LD.users?cust():'Loading…');if(cur&&STAFF)caseM(cur,1);if(tx&&!STAFF)receipt(tx,1);if(ib&&!STAFF)inbox();bell();putF(z)}
function closeM(){cur=tx=ib=null;$('#mod').innerHTML=''}

/* ================= NOTIFICATIONS (SMS + email style, stored in db 'notifications') ================= */
const NM={
 opened:(t,c)=>['We are looking into your transfer',`${BANK}: Case ${c} opened for your ${N(t.amt)} transfer to ${t.rn}. We are verifying it. No action needed.`,`Hello, we have opened case ${c} for your ${N(t.amt)} transfer to ${t.rn}. Our DT Engine is checking whether the money reached the recipient. You do not need to do anything. We will update you as soon as the checks are complete.`],
 verified:(t,c)=>['Good news: your transfer was delivered',`${BANK}: Case ${c} closed. Your ${N(t.amt)} transfer to ${t.rn} was confirmed delivered and is now marked Successful. No refund is due.`,`Hello, we checked with the recipient bank and confirmed that ${N(t.amt)} reached ${t.rn}. Your transfer status is now Successful, so no refund is due. Case ${c} is closed.`],
 escalated:(t,c)=>['Your case is with our accounts team',`${BANK}: Checks on case ${c} (${N(t.amt)}) are complete. Our accounts team is reviewing it and will update you.`,`Hello, our automated checks on case ${c} for your ${N(t.amt)} transfer to ${t.rn} are complete. An accountant will now review the results and decide on your refund. We will notify you as soon as there is a decision.`],
 refunded:(t,c)=>['Your refund has been approved',`${BANK}: Refund of ${N(t.amt)} approved and credited to your account (case ${c}).`,`Hello, good news: your refund of ${N(t.amt)} for case ${c} has been approved and credited to your account. We are sorry for the inconvenience.`],

 <div class="card ov"><h3 style="margin-top:0">Latest cases</h3><table class="tbl"><tr><th>Case</th><th>Customer</th><th>Amount</th><th>Status</th><th>Confidence</th></tr>${rec.map(c=>`<tr class="c" onclick="cur='${c.id}';R()"><td>${c.id.slice(0,7)}</td><td>${c.uname}</td><td>${N(c.amt)}</td><td>${st(c.status)}</td><td>${c.p!=null?(c.p*100).toFixed(1)+'%':'…'}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No cases yet</td></tr>'}</table></div>`}
function txT(){const l=[...S.txs].sort((a,b)=>b.ts-a.ts).filter(t=>tf==='all'||t.status===tf||(tf==='df'&&t.status==='failed'&&t.debited));
 return `<div class="card ov"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><label class="hint">Filter</label><select style="width:auto;margin:0" onchange="tf=this.value;R()">${[['all','All'],['success','Successful'],['failed','Failed'],['df','Failed and debited'],['refunded','Refunded']].map(([k,n])=>`<option value="${k}" ${tf===k?'selected':''}>${n}</option>`).join('')}</select><span class="hint">${l.length} of ${S.txs.length}</span></div>
 <table class="tbl"><tr><th>Time</th><th>Customer</th><th>Recipient</th><th>Amount</th><th>Debited</th><th>Status</th><th>Case</th></tr>${l.map(t=>`<tr><td>${D(t.ts)}</td><td>${nm(t.uid)}</td><td>${t.rn}<br><span class="mu">${t.rb} | ${t.ra}</span></td><td>${N(t.amt)}</td><td>${t.debited?'Yes':'No'}</td><td>${st(t.status)}</td><td>${t.caseId?`<span style="text-decoration:underline;cursor:pointer" onclick="cur='${t.caseId}';R()">${t.caseId.slice(0,7)}</span>`:'—'}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">No transactions</td></tr>'}</table></div>`}
function patT(){if(!DTEngine.patterns)return '<div class="card">This engine version has no patterns().</div>';const P=DTEngine.patterns(S.txs,S.cases);
 return `<div class="card ov"><h3 style="margin-top:0">Bank and switch failures</h3><div class="hint">A bank is flagged at 3 or more transfers with a 40% or higher failure rate.</div><table class="tbl"><tr><th>Bank</th><th>Transfers</th><th>Failed</th><th>Failure rate</th><th></th></tr>${P.banks.map(b=>`<tr><td>${b.bank}</td><td>${b.total}</td><td>${b.failed}</td><td><div style="display:flex;align-items:center;gap:6px"><div style="height:8px;width:${Math.round(b.rate*100)}px;max-width:100px;background:${b.flagged?'var(--pr)':'var(--ok)'};border-radius:4px"></div>${(b.rate*100).toFixed(0)}%</div></td><td>${b.flagged?'<span class="tag s-failed">Recurring failures</span>':''}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No transfers yet</td></tr>'}</table></div>
 <div class="card ov"><h3 style="margin-top:0">Customers to watch for refund abuse</h3><div class="hint">Flagged when half of 3 or more disputes were verified as delivered or not debited, or 3 or more refunds were approved.</div><table class="tbl"><tr><th>Customer</th><th>Disputes</th><th>Verified not owed</th><th>Refunds</th><th></th></tr>${P.customers.map(c=>`<tr><td>${c.name}</td><td>${c.disputes}</td><td>${c.falseClaims}</td><td>${c.refunds}</td><td>${c.flagged?'<span class="tag s-failed">Review</span> <span class="hint">'+c.reason+'</span>':''}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No cases yet</td></tr>'}</table></div>`}
const KIND={ghost_debit:'Ghost debit',reversal_not_applied:'Reversal not applied',status_mismatch:'Status mismatch',amount_mismatch:'Amount mismatch',refunded_but_settled:'Refunded but settled',missing_in_ledger:'Missing in ledger'},ACT={correct_to_success:'Correct to Successful',open_case:'Open case',review_case:'View case'};
function reconRun(text){if(!DTEngine.reconcile)return toast('This engine version has no reconcile()');const rows=DTEngine.parseSettlement(text);if(!rows.length)return toast('No rows found. The file needs a header row with ref, amount and status columns.');RW=rows;aud('Reconciliation run on '+rows.length+' rows');R()}
function reconFile(el){const f=el.files&&el.files[0];if(f)f.text().then(reconRun)}
async function reconSample(){const dl=await claude.use('downloads');if(!dl)return toast('Downloads unavailable here');try{await dl.save({filename:'settlement_sample.csv',data:DTEngine.sampleSettlement(S.txs)})}catch(e){if(!e||e.code!=='declined')toast('Could not save the file')}}
async function reconAct(i){const x=DTEngine.reconcile(RW,S.txs).issues[i],t=x&&S.txs.find(v=>v.id===x.txid);if(!t)return;
 if(x.action==='correct_to_success'){await upd('txs',t.id,{status:'success'});aud('Reconciliation: '+t.ref+' corrected to Successful');toast('Status corrected to Successful')}
 else if(x.action==='open_case'){toast('Opening a case. DT Engine is checking it.');await runCase(t,'auto')}
 else if(x.action==='review_case'){cur=t.caseId;R()}}
function recT(){let h=`<div class="card"><h3 style="margin-top:0">End-of-day reconciliation</h3><div class="hint">Upload the switch's settlement file (CSV with ref, session, amount and status columns) to catch ghost debits and status mismatches nobody reported.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center"><input type="file" accept=".csv,text/csv" style="width:auto;margin:0" onchange="reconFile(this)"><button class="p" onclick="reconRun(DTEngine.sampleSettlement(S.txs))">Run on a demo file</button><button onclick="reconSample()">Download demo file</button></div></div>`;
 if(!RW||!DTEngine.reconcile)return h;const RC=DTEngine.reconcile(RW,S.txs),s=RC.summary;
 return h+`<div class="card"><b>${s.rows}</b> rows checked · <b>${s.matched}</b> matched · <b style="color:${s.issues?'var(--pr)':'var(--ok)'}">${s.issues}</b> issues · <b>${s.unreported}</b> with no case opened yet</div>
 <div class="card ov"><table class="tbl"><tr><th>Issue</th><th>Ref</th><th>Customer</th><th>Amount</th><th>Case</th><th>Detail</th><th></th></tr>${RC.issues.map((x,i)=>`<tr><td><span class="tag s-failed">${KIND[x.kind]||x.kind}</span></td><td>${clean(x.ref)}</td><td>${x.uid?nm(x.uid):'—'}</td><td>${N(x.amount||0)}</td><td>${x.reported?'Yes':'<span class="mu">None</span>'}</td><td>${x.detail}</td><td>${ACT[x.action]&&x.txid?`<button onclick="reconAct(${i})">${ACT[x.action]}</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">No issues found</td></tr>'}</table></div>`}
async function trainE(){if(!S.examples.length)return toast('No decisions to learn from yet');const c=DTEngine.train(S.examples.map(e=>({f:e.f,y:e.y})),CFG);await put('engine','config',c);toast('DT Engine retrained on '+c.trainedOn+' examples (v'+c.version+')')}
async function exportE(){const dl=await claude.use('downloads');if(!dl)return toast('Downloads unavailable');try{await dl.save({filename:'dt_engine.js.txt',data:document.getElementById('dt-engine').textContent+'\n/* current trained config: */\n/* '+JSON.stringify(CFG)+' */\nif(typeof module!=="undefined")module.exports=DTEngine;'});toast('Saved as dt_engine.js.txt. Rename it to dt_engine.js.')}catch(e){if(!e||e.code!=='declined')toast('Could not save the file ('+((e&&e.code)||'error')+')')}}
setInterval(()=>{if(STAFF&&(tab==='cases'||tab==='dash')&&!cur)R()},30000);boot();
</script></body></html>
