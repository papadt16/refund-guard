<!--
DATA CONTRACT (shared db; customer + accountant routes of this one artifact)
Routes: (no hash)=customer app · #accountant=staff portal. Each route owns its own <script id="side-..."> style section below.
Collections (docs):

 txs/{id}      {id,uid,amt,rn,rb,ra,sess,ref,ts,sim,status(success|failed|refunded),debited,caseId}
 cases/{id}    {id,txid,uid,uname,amt,type(auto|customer),status(investigating|awaiting|auto|refunded|rejected),opened,logs[{t,m,k}],f{tsq,ben,rev,dup},p,verdict(refund|review|auto_success|no_debit),note,acctNote,decidedAt}
 examples/{caseId} {f,y(1=refund was due),ts}   <- written on accountant decision; training data for DT Engine

DT Engine = <script id="dt-engine"> (dependency-free, exportable). Adapters inside it are the swap-point for real NIP / core-banking calls.

<div class="top"><div class="logo" id="lg">Demo Bank</div><span id="who" class="hint"></span></div><div class="wrap" id="app">Loading…</div><div id="mod"></div>

<script id="dt-engine">
/* ===== DT ENGINE v1 — dependency-free refund-resolution engine =====
   Flow: detect (failed + debited) -> run checks via ADAPTERS -> feature vector -> logistic confidence score -> verdict.
   p = probability a refund is DUE. verdict: p>=hi 'refund' | p<=lo 'auto_success' | else 'review'. Humans always decide refunds.
   Train: DTEngine.train(examples,cfg) where examples=[{f:{tsq,ben,rev,dup},y:0|1}]. */
const DTEngine=(()=>{
const FEATS=['tsq','ben','rev','dup'],sig=x=>1/(1+Math.exp(-x)),fmt=v=>v===1?'CONFIRMED':v===.5?'PENDING/NO RESPONSE':'NONE';
const defaults=()=>({version:1,bias:2.5,w:{tsq:-3,ben:-3.5,rev:-2,dup:.5},hi:.8,lo:.1,slaMin:30,trainedOn:0});
/* ADAPTERS: replace with real NIBSS NIP status query, beneficiary-bank confirmation, core-banking ledger lookups. */
const adapters={
 ledger:tx=>({debited:tx.debited}),
 core:tx=>({status:tx.sim==='ok'?'SUCCESS':'FAILED'}),
 nip:tx=>({v:{ok:1,mismatch:1,ghost:0,clean:0,unclear:.5}[tx.sim]??0}),
 beneficiary:tx=>({v:{ok:1,mismatch:1,ghost:0,clean:0,unclear:.5}[tx.sim]??0}),
 reversal:tx=>({v:0}),
 dup:(tx,all)=>({v:all.filter(x=>x.id!==tx.id&&x.uid===tx.uid&&x.ra===tx.ra&&x.amt===tx.amt&&Math.abs(x.ts-tx.ts)<36e5).length?1:0})};
const score=(f,c)=>sig(c.bias+FEATS.reduce((s,k)=>s+c.w[k]*(f[k]||0),0));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function investigate(tx,all,cfg,log,delay=550){
 const L=async(m,k)=>{await log(m,k);await wait(delay)};
 const led=adapters.ledger(tx),core=adapters.core(tx);
 await L(led.debited?'CHECK 1 Ledger: debit of '+tx.amt+' found for ref '+tx.ref+'.':'CHECK 1 Ledger: no debit entry.',led.debited?'w':'k');
 if(!led.debited)return{f:{},p:0,verdict:'no_debit'};
 await L('CHECK 2 Core switch status: '+core.status+'.',core.status==='FAILED'?'w':'k');
 const nip=adapters.nip(tx),ben=adapters.beneficiary(tx),rev=adapters.reversal(tx),dup=adapters.dup(tx,all);
 await L('CHECK 3 NIP status query, session '+tx.sess+': '+(nip.v===1?'APPROVED':nip.v===.5?'PENDING':'NOT FOUND'),nip.v===1?'k':'w');
 await L('CHECK 4 Beneficiary bank ('+tx.rb+') credit: '+fmt(ben.v),ben.v===1?'k':'w');
 await L('CHECK 5 Reversal sweep: '+(rev.v?'reversal found':'no reversal entry within SLA window'),rev.v?'k':'e');
 await L('CHECK 6 Duplicate/fraud screen: '+(dup.v?'similar transfer in last hour':'clear'),dup.v?'w':'k');
 const f={tsq:nip.v,ben:ben.v,rev:rev.v,dup:dup.v},p=score(f,cfg);
 const verdict=p>=cfg.hi?'refund':p<=cfg.lo?'auto_success':'review';
 await L('SCORE p(refund due)='+p.toFixed(3)+' (hi '+cfg.hi+', lo '+cfg.lo+') -> '+verdict.toUpperCase(),verdict==='refund'?'e':verdict==='review'?'w':'k');
 return{f,p,verdict}}
function train(ex,cfg,epochs=300,lr=.3){const c=JSON.parse(JSON.stringify(cfg));if(!ex.length)return c;
 for(let e=0;e<epochs;e++)for(const x of ex){const err=x.y-score(x.f,c);c.bias+=lr*err;FEATS.forEach(k=>c.w[k]+=lr*err*(x.f[k]||0))}
 c.version++;c.trainedOn=ex.length;return c}
return{FEATS,defaults,adapters,score,investigate,train}})();
</script>

<script>
const $=s=>document.querySelector(s),N=n=>'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2}),D=t=>new Date(t).toLocaleString('en-NG',{month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}),rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const BANK='Demo Bank'; /* <- change the bank's name here */
const STAFF=location.hash==='#accountant';let db,user,uid,S={users:[],txs:[],cases:[],examples:[],audit:[]},CFG=DTEngine.defaults(),tab='cases',cur=null,tx=null,busy=false;
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)};
const st=s=>`<span class="tag s-${s}">${({success:'Successful',failed:'Failed',refunded:'Refunded',awaiting:'Awaiting accountant',investigating:'DT Engine checking…',auto:'Auto-resolved',rejected:'Rejected'})[s]||s}</span>`;
const put=(c,id,d)=>db.collection(c).doc(id).set(d),upd=(c,id,d)=>db.collection(c).doc(id).update(d);
const aud=m=>put('audit',rid(),{t:Date.now(),m}).catch(()=>{});
const watch=n=>db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));R()});
async function boot(){
 $('#lg').textContent=STAFF?BANK+' · Staff portal':BANK;
 const cl=window.claude&&await claude.use('db');user=window.claude&&await claude.use('user');
 if(!cl||!user){$('#app').innerHTML='<div class="card">Please open this page signed in to claude.ai (as a Contributor on the artifact) so shared data can load.</div>';return}
 db=cl;uid=await user.id();['users','txs','cases','examples','audit'].forEach(watch);
 db.collection('engine').doc('config').onSnapshot(s=>{if(s.exists)CFG={...DTEngine.defaults(),...s.data()};R()});
 addEventListener('hashchange',()=>location.reload())}
function R(){if(!db)return;$('#app').innerHTML=STAFF?staff():cust();if(cur&&STAFF)caseM(cur,1);if(tx&&!STAFF)receipt(tx,1)}
function closeM(){cur=tx=null;$('#mod').innerHTML=''}
const log=(cid)=>async(m,k)=>{const c=S.cases.find(x=>x.id===cid)||{logs:[]};const logs=[...(c.logs||[]),{t:Date.now(),m,k:k||''}];await upd('cases',cid,{logs})};

/* ================= CUSTOMER SIDE ================= */
function cust(){const u=S.users.find(x=>x.id===uid);
 if(!u)return `<div class="card" style="max-width:380px;margin:30px auto"><h3 style="margin-top:0">Open a ${BANK} account</h3><label class="hint">Your name</label><input id="nm" placeholder="e.g. Ada Obi"><button class="p" style="width:100%" onclick="signup()">Create account · ₦100,000 starter balance</button></div>`;
 const my=S.txs.filter(t=>t.uid===uid).sort((a,b)=>b.ts-a.ts);
 return `<div class="grid"><div><div class="bal"><span>${u.name} · ${u.acct}</span><b>${N(u.bal)}</b>${u.frozen?'<span class="tag">Account frozen</span>':''}</div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Transfer money</h3><form onsubmit="send(this);return false"><label class="hint">Recipient name</label><input name="rn" value="BELLO GARBA"><label class="hint">Bank</label><select name="rb"><option>OPay</option><option>GTBank</option><option>Access Bank</option><option>Kuda</option><option>PalmPay</option></select><label class="hint">Account number</label><input name="ra" value="8108080082" inputmode="numeric"><label class="hint">Amount (₦)</label><input name="amt" type="number" value="1500">
 <label class="hint">🧪 Test mode: simulate network outcome</label><select name="sim"><option value="ok">Normal – succeeds</option><option value="ghost">Fails, debited, recipient NOT credited</option><option value="mismatch">Marked failed, debited, recipient WAS credited</option><option value="unclear">Marked failed, debited, status unclear</option><option value="clean">Fails, no debit</option></select><button class="p" style="width:100%" ${busy?'disabled':''}>Send</button></form></div></div>
 <div class="card"><h3 style="margin-top:0">Transactions</h3>${my.map(t=>`<div class="row" style="cursor:pointer" onclick="receipt('${t.id}')"><div><b>${t.rn}</b><br><span class="mu">${D(t.ts)}</span></div><div style="text-align:right"><b>${t.debited?'−':''}${N(t.amt)}</b><br>${st(t.status)}</div></div>`).join('')||'<div class="mu">No transactions yet.</div>'}<div class="hint">Tap a transaction for its receipt and to report a dispute.</div></div></div>`}
async function signup(){const n=$('#nm').value.trim();if(!n)return toast('Enter your name');await put('users',uid,{name:n,acct:'20'+Math.floor(1e8+Math.random()*9e8),bal:100000,frozen:false});aud('New customer '+n)}
async function send(f){const u=S.users.find(x=>x.id===uid),amt=+f.amt.value,sim=f.sim.value;
 if(u.frozen)return toast('Account frozen. Contact the bank.');if(!f.rn.value||!f.ra.value||amt<=0)return toast('Fill all fields');if(amt>u.bal)return toast('Insufficient balance');
 busy=true;const id='T'+rid(),t={id,uid,amt,rn:f.rn.value.toUpperCase(),rb:f.rb.value,ra:f.ra.value,sess:'1000332'+Date.now()+Math.floor(Math.random()*1e5),ref:rid().slice(0,11),ts:Date.now(),sim,status:sim==='ok'?'success':'failed',debited:sim!=='clean',caseId:null};
 if(t.debited)await upd('users',uid,{bal:u.bal-amt});await put('txs',id,t);aud('Transfer '+id+' '+N(amt)+' by '+u.name+' -> '+t.status);
 if(t.status==='failed'&&t.debited){toast('Transfer failed. You were debited — DT Engine has flagged it automatically.');await runCase(t,'auto')}else toast(t.status==='success'?'Transfer successful':'Transfer failed. You were not debited.');busy=false;R()}
async function runCase(t,type,note){const u=S.users.find(x=>x.id===t.uid)||{name:'?'},cid='C'+rid();
 await put('cases',cid,{id:cid,txid:t.id,uid:t.uid,uname:u.name,amt:t.amt,type,status:'investigating',opened:Date.now(),logs:[{t:Date.now(),m:'Case opened via '+(type==='auto'?'AUTO-DETECTION (status FAILED + debit present)':'CUSTOMER DISPUTE'+(note?': "'+note+'"':''))+'. DT Engine v'+CFG.version+' starting.',k:''}],note:note||'',verdict:null});
 await upd('txs',t.id,{caseId:cid});const r=await DTEngine.investigate(t,S.txs,CFG,log(cid));
 const out={f:r.f,p:r.p,verdict:r.verdict,slaDue:Date.now()+CFG.slaMin*6e4};
 if(r.verdict==='auto_success'||r.verdict==='no_debit'){if(t.status==='failed')await upd('txs',t.id,{status:'success'});out.status='auto';await log(cid)('Money reached beneficiary. Transaction status corrected FAILED -> SUCCESSFUL. No refund due.','k')}
 else{out.status='awaiting';await log(cid)(r.verdict==='refund'?'Escalated to accountant with REFUND recommendation.':'Evidence inconclusive. Escalated to accountant for manual review.','w')}
 await upd('cases',cid,out);aud('DT Engine finished '+cid+': '+r.verdict)}
function receipt(id,keep){tx=id;const t=S.txs.find(x=>x.id===id);if(!t)return;const c=S.cases.find(x=>x.id===t.caseId),ok=t.status!=='failed',dot=(x,b)=>`<div><div class="dot ${x}"></div>${b}</div>`;
 $('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="rcpt" style="margin:auto"><div class="mu" style="text-align:center">Transaction Details</div><h2 style="text-align:center;margin:6px 0">${N(t.amt)}</h2><div style="text-align:center">${st(t.status)}</div>
 <div class="steps">${dot('','Payment<br>'+(t.debited?'successful':'declined'))}${dot(t.debited?'':'x','Submitted<br>to bank')}${dot(ok?'':'x','Received<br>by bank')}</div>
 <div class="note">${t.status==='success'?'The transfer has been successfully paid and submitted to the recipient bank. Kindly note the actual credited time is subject to the bank.':t.status==='refunded'?'This transaction failed and your money was refunded after review.':t.debited?'This transfer did not complete. Our system is verifying it and you will be updated.':'This transfer did not complete. You were not debited.'}</div>
 <div class="row"><span class="mu">Transfer Amount</span><b>${N(t.amt)}</b></div><div class="row"><span class="mu">Fee</span><span><s class="mu">₦13.50</s> ₦0.00</span></div><div class="row"><span class="mu">Payment Amount</span><b>${N(t.amt)}</b></div>
 <div class="row"><span class="mu">Recipient</span><span style="text-align:right">${t.rn}<br><span class="mu">${t.rb} | ${t.ra}</span></span></div><div class="row"><span class="mu">Session ID</span><span style="word-break:break-all;text-align:right;max-width:60%">${t.sess}</span></div>
 <div class="note">If the recipient account is not credited within 5 minutes, use the Session ID to contact the recipient bank.</div>
 <div class="row"><span class="mu">Completion Time</span><span>${D(t.ts)}</span></div><div class="row"><span class="mu">Transaction ID</span><span>${t.ref}</span></div><div class="row"><span class="mu">Payment Type</span><span>Money Transfer</span></div>
 ${c?`<div class="row"><span class="mu">Dispute case</span><span>${st(c.status)}</span></div>`:`<div class="row"><span class="mu">Any questions about this transaction?</span></div><select id="rs"><option>Receiver didn't get the money</option><option>I was debited but it shows failed</option><option>Wrong amount</option><option>Unauthorized transaction</option></select>`}
 <div style="display:flex;gap:8px"><button onclick="closeM()" style="flex:1">Close</button>${c?'':`<button class="p" style="flex:1" onclick="dispute('${t.id}')">Report a Dispute</button>`}</div></div></div>`}
async function dispute(id){const t=S.txs.find(x=>x.id===id),n=$('#rs').value;closeM();toast('Dispute submitted. DT Engine is verifying it.');await runCase(t,'customer',n)}

/* ================= ACCOUNTANT SIDE (staff portal, #accountant) ================= */
function staff(){const aw=S.cases.filter(c=>c.status==='awaiting').length;
 let h=`<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">${[['cases','Cases'+(aw?' ('+aw+')':'')],['cu','Customers'],['en','DT Engine'],['au','Audit']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';R()">${n}</button>`).join('')}</div>`;
 if(tab==='cases')h+=`<div class="card ov"><table class="tbl"><tr><th>Case</th><th>Customer</th><th>Amount</th><th>Source</th><th>Confidence (refund due)</th><th>Status</th><th>SLA</th></tr>${[...S.cases].sort((a,b)=>b.opened-a.opened).map(c=>`<tr class="c" onclick="cur='${c.id}';R()"><td>${c.id.slice(0,7)}</td><td>${c.uname}</td><td>${N(c.amt)}</td><td>${c.type==='auto'?'Auto-flag':'Customer'}</td><td>${c.p!=null?(c.p*100).toFixed(1)+'%':'…'}</td><td>${st(c.status)}</td><td>${c.status==='awaiting'?(Date.now()>c.slaDue?'<span class="tag s-failed">Overdue</span>':Math.ceil((c.slaDue-Date.now())/6e4)+'m'):'—'}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">No cases yet</td></tr>'}</table></div>`;
 if(tab==='cu')h+=`<div class="card ov"><table class="tbl"><tr><th>Name</th><th>Account</th><th>Balance</th><th>Cases</th><th></th></tr>${S.users.map(u=>`<tr><td>${u.name}</td><td>${u.acct}</td><td>${N(u.bal)}</td><td>${S.cases.filter(c=>c.uid===u.id).length}</td><td><button onclick="upd('users','${u.id}',{frozen:${!u.frozen}});aud('${u.frozen?'Unfroze':'Froze'} ${u.name}')">${u.frozen?'Unfreeze':'Freeze'}</button></td></tr>`).join('')}</table></div>`;
 if(tab==='en')h+=`<div class="card"><h3 style="margin-top:0">DT Engine v${CFG.version}</h3><div class="hint">Logistic confidence model: p = sigmoid(bias + Σ weight × evidence). Accountant decisions become training examples.</div>
  <table class="tbl"><tr><th>Bias</th>${DTEngine.FEATS.map(k=>`<th>w:${k}</th>`).join('')}<th>hi</th><th>lo</th><th>Trained on</th></tr><tr><td>${CFG.bias.toFixed(2)}</td>${DTEngine.FEATS.map(k=>`<td>${CFG.w[k].toFixed(2)}</td>`).join('')}<td>${CFG.hi}</td><td>${CFG.lo}</td><td>${CFG.trainedOn}</td></tr></table>
  <p>Labelled examples available: <b>${S.examples.length}</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="p" onclick="trainE()">Train on accountant decisions</button><button onclick="put('engine','config',DTEngine.defaults());toast('Reset to defaults')">Reset</button><button onclick="exportE()">Export engine (.js)</button></div></div>`;
 if(tab==='au')h+=`<div class="card"><div class="log">${[...S.audit].sort((a,b)=>b.t-a.t).map(a=>`<div>[${D(a.t)}] ${a.m}</div>`).join('')||'No activity'}</div></div>`;return h}
function caseM(id,keep){const c=S.cases.find(x=>x.id===id);if(!c)return;
 $('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h3 style="margin:0 0 4px">Case ${c.id.slice(0,7)} ${st(c.status)}</h3><div class="mu">${c.uname} · ${N(c.amt)} · ${c.type==='auto'?'Auto-flagged':'Customer dispute'} · opened ${D(c.opened)}</div>
 ${c.p!=null?`<div class="note">Confidence a refund is due: <b>${(c.p*100).toFixed(1)}%</b> · verdict <b>${c.verdict}</b> · evidence ${JSON.stringify(c.f)}</div>`:''}
 <h4>DT Engine log</h4><div class="log">${(c.logs||[]).map(l=>`<div class="${l.k}">[${new Date(l.t).toLocaleTimeString('en-GB')}] ${l.m}</div>`).join('')}</div>
 ${c.status==='awaiting'?`<h4>Your decision</h4><input id="an" placeholder="Decision note"><div style="display:flex;gap:8px"><button class="g" style="flex:1" onclick="decide('${c.id}',1)">Approve refund</button><button class="p" style="flex:1" onclick="decide('${c.id}',0)">Reject</button></div>`:c.acctNote?`<div class="note">Decision note: ${c.acctNote}</div>`:''}
 <div style="margin-top:10px"><button onclick="closeM()">Close</button></div></div></div>`}
async function decide(id,y){const c=S.cases.find(x=>x.id===id),u=S.users.find(x=>x.id===c.uid),note=$('#an').value;
